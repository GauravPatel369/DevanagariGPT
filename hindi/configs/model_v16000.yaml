# Vocabulary sweep: V=16,000, d_ff=1344 (2.6x d_model).
#
# ONE EPOCH over the corpus: 26,294 steps x 16,384 tokens = 430,800,896,
# against 430,807,734 training tokens at this vocabulary. Step counts differ
# BETWEEN vocabularies on purpose -- each tokenizer turns the same text into a
# different number of tokens, so equal steps would mean unequal text and the
# comparison would measure data volume rather than the tokenizer.
#
# Parameter count is held at ~25.35M by d_ff, so vocabulary trades against FFN
# width. Compare runs on BITS PER BYTE, never perplexity.
language: hindi
lang_code: hi
model:
  vocab_size: 16000
  context: 512
  d_model: 512
  n_layer: 7
  n_head: 8
  d_ff: 1344
  dropout: 0.1
  tie_embeddings: true
  rope_theta: 10000.0
train:
  seed: 1337
  micro_batch: 16
  grad_accum: 2
  max_steps: 26294
  warmup_steps: 480
  learning_rate: 0.0006
  min_lr: 6.0e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 50
  eval_every: 500
