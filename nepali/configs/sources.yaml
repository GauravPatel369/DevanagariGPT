# Model L — Nepali (allowed lower-resource list). Data sources for Phase 1.
#
# Selection rationale (report §1.1): of the ten permitted languages, Nepali has
# by far the largest public footprint — sizeable CC-100/CulturaX/mC4 slices, a
# ~30k-article Wikipedia, and an active digital news industry. It is the only
# one where approaching the 500M-token target is plausible.
#
# Known risk, addressed by stage 5: Nepali shares the Devanagari script and much
# Sanskrit-derived vocabulary with Hindi (Model H). The `ne` slices of CC-100
# and mC4 are known to contain Hindi, Bhojpuri and Maithili text. Language ID
# and cross-corpus dedup are therefore mandatory, not optional.

language: nepali
lang_code: ne
rps_per_domain: 1.5

# --- Crawl priority -----------------------------------------------------------
# Same mechanism as the Hindi config: every domain runs simultaneously, and this
# order sets each one's share of a round rather than its turn. ~180k pending
# URLs here, mostly news and encyclopedia, so the newer registers are weighted
# up and news is weighted down.
category_priority:
  - sports
  - current_affairs
  - magazine
  - education
  - poetry
  - literature
  - encyclopedia
  - news

# Nepali outlets yield roughly 30-60% of the per-domain volume of Hindi ones,
# so more domains are seeded and archives are crawled deeper.
# `category` is metadata only — no pipeline stage reads it. It exists so the
# register-mix table in report/phase1.md §3.1 can be generated from the config
# instead of being maintained by hand.
#
# WARNING: `wikisource_ne` and `nepali_kitab` both declare
# domain: ne.wikisource.org. cli.py builds source_of as a dict keyed by domain,
# so the later entry wins and ALL Nepali Wikisource documents are stamped
# source: nepali_kitab. Drop one of the two entries before the next crawl.
manual_sites:
  - name: ekantipur          # largest Nepali daily online; deepest archive
    domain: ekantipur.com
    root: https://ekantipur.com
    category: news
  - name: onlinekhabar
    domain: www.onlinekhabar.com
    root: https://www.onlinekhabar.com
    category: news
  - name: setopati
    domain: www.setopati.com
    root: https://www.setopati.com
    category: news
  - name: ratopati
    domain: www.ratopati.com
    root: https://www.ratopati.com
    category: news
  - name: nagariknews
    domain: nagariknews.nagariknetwork.com
    root: https://nagariknews.nagariknetwork.com
    category: news
  - name: bbc_nepali
    domain: www.bbc.com
    root: https://www.bbc.com/nepali
    category: news
  - name: himalkhabar        # long-form magazine journalism
    domain: www.himalkhabar.com
    root: https://www.himalkhabar.com
    category: magazine
  - name: wikisource_ne      # Devkota and other public-domain literature
    domain: ne.wikisource.org
    root: https://ne.wikisource.org
    category: literature
  - name: wikipedia_ne       # Nepali encyclopedia articles via MediaWiki API
    domain: ne.wikipedia.org
    root: https://ne.wikipedia.org
    category: encyclopedia
  - name: sahityaras         # Open Nepali literature & literary works
    domain: sahityasangraha.com
    root: https://sahityasangraha.com
    category: literature


  # ---------------------------------------------------------------------------
  # Register expansion: current affairs, sports, education, magazine.
  #
  # UNVALIDATED. Run `python scripts/probe_domains.py --lang nepali` and delete
  # every entry that discovers few URLs or extracts poorly before crawling.
  # Nepali sites are more likely than Hindi ones to lack XML sitemaps, in which
  # case discovery falls through to the WordPress REST API and then to BFS link
  # crawling — both much slower, so check `discovered_urls` before committing.
  #
  # As above, every domain here is new. Never add a second entry for a domain
  # that already appears in this file.
  # ---------------------------------------------------------------------------

  # --- current affairs ---
  - name: baahrakhari
    domain: www.baahrakhari.com
    root: https://www.baahrakhari.com
    category: current_affairs
  - name: deshsanchar
    domain: deshsanchar.com
    root: https://deshsanchar.com
    category: current_affairs
  - name: nepallive
    domain: nepallive.com
    root: https://nepallive.com
    category: current_affairs
  - name: himalpress
    domain: himalpress.com
    root: https://himalpress.com
    category: current_affairs

  # --- sports ---
  - name: goalnepal         # largest Nepali-language football desk
    domain: www.goalnepal.com
    root: https://www.goalnepal.com
    category: sports
  - name: sportsnepal
    domain: sportsnepal.com.np
    root: https://sportsnepal.com.np
    category: sports
  - name: khelkhabar
    domain: www.khelkhabar.com
    root: https://www.khelkhabar.com
    category: sports

  # --- education ---
  - name: wikibooks_ne      # MediaWiki: handled by the existing Action API path
    domain: ne.wikibooks.org
    root: https://ne.wikibooks.org
    category: education

  # --- magazine ---
  - name: shilapatra
    domain: www.shilapatra.com
    root: https://www.shilapatra.com
    category: magazine
  - name: ukeraa
    domain: www.ukeraa.com
    root: https://www.ukeraa.com
    category: magazine
  - name: nepalkhabar
    domain: www.nepalkhabar.com
    root: https://www.nepalkhabar.com
    category: magazine


# NOTE: kathmandupost.com and spotlightnepal.com publish in ENGLISH despite the
# Kantipur-family branding. Do not seed them.

hf_sources:
  - name: sangraha_verified
    repo: ai4bharat/sangraha
    config: verified
    split: nep
    text_key: text
    max_docs: 1500000          # ~220M tokens (Sangraha verified Devanagari)
  - name: sangraha_unverified
    repo: ai4bharat/sangraha
    config: unverified
    split: nep
    text_key: text
    max_docs: 1500000          # ~200M tokens (Sangraha unverified Devanagari web slice)
