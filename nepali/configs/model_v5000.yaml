# Vocabulary sweep: V=5,000, d_ff=2176 (4.2x d_model).
#
# Total parameters 25,546,112 -- within +0.77% of the
# Phase-2 budget, so vocabulary trades against FFN width rather than against
# model size. Compare these runs on BITS PER BYTE, never perplexity: each
# tokenizer emits a different number of tokens for the same text.
language: nepali
lang_code: ne
model:
  vocab_size: 5000
  context: 512
  d_model: 512
  n_layer: 7
  n_head: 8
  d_ff: 2176
  dropout: 0.1
  tie_embeddings: true
  rope_theta: 10000.0
train:
  seed: 1337
  micro_batch: 16
  grad_accum: 2
  max_steps: 31266
  warmup_steps: 560
  learning_rate: 0.0006
  min_lr: 6.0e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 50
  eval_every: 500
